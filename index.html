<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#04050b">
<title>卡拉比–丘流形 · Calabi–Yau Manifold</title>
<style>
:root{
  --bg:#04050b; --ink:#eceffa; --mute:rgba(226,231,250,.62); --faint:rgba(226,231,250,.34);
  --line:rgba(255,255,255,.085); --line2:rgba(255,255,255,.14);
  --accent:#7fe3d4; --accent2:#b79cff; --panel-w:332px;
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
  --num:"SF Mono","JetBrains Mono","Cascadia Code",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab;opacity:0;transition:opacity 1.6s ease}
body.ready #stage{opacity:1}
#stage:active{cursor:grabbing}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* ---------- HUD ---------- */
#hud{position:fixed;left:34px;top:30px;pointer-events:none;z-index:3;transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}
#hud h1{margin:0;font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:.2em;line-height:1.15;
  background:linear-gradient(100deg,#fff 10%,var(--accent) 55%,var(--accent2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(140,170,255,.18))}
#hud .sub{margin-top:7px;font-size:10.5px;letter-spacing:.46em;color:var(--faint);text-transform:uppercase}
#hud .eq{margin-top:16px;font-family:var(--serif);font-style:italic;font-size:19px;letter-spacing:.02em;color:var(--mute);white-space:nowrap}
#hud .eq sup,#hud .eq sub{font-size:.62em;font-style:normal;font-family:var(--num);letter-spacing:0}
#hud .eq sup{color:var(--accent)}
#hud .meta{margin-top:7px;font-size:11px;letter-spacing:.12em;color:var(--faint);font-variant-numeric:tabular-nums}
#hint{position:fixed;left:34px;bottom:26px;font-size:11px;letter-spacing:.14em;color:var(--faint);pointer-events:none;z-index:3;transition:opacity 1.2s}
#hint.gone{opacity:0}
body.ui-hidden #hud{opacity:0;transform:translateY(-10px)}
body.ui-hidden #hint{opacity:0}

/* ---------- panel ---------- */
#panel{position:fixed;top:16px;right:16px;bottom:16px;width:var(--panel-w);z-index:5;display:flex;flex-direction:column;border-radius:22px;
  background:linear-gradient(180deg,rgba(20,23,42,.58),rgba(9,10,22,.5));
  -webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);
  border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);
  transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .45s}
body.ui-hidden #panel{transform:translateX(calc(100% + 28px));opacity:0;pointer-events:none}
#panel header{display:flex;align-items:center;gap:8px;padding:15px 16px 12px 20px;flex:none;position:relative}
#panel header .ttl{display:flex;gap:2px;flex:1;margin-left:-9px}
.tab{position:relative;padding:7px 9px;border-radius:9px;font-size:12px;letter-spacing:.22em;color:var(--faint);transition:color .25s;white-space:nowrap}
.tab:hover{color:#fff}
.tab.on{color:var(--ink)}
.tab::after{content:"";position:absolute;left:9px;right:calc(9px + .22em);bottom:2px;height:1px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;transform:scaleX(.4);transition:all .3s}
.tab.on::after{opacity:1;transform:none}
#tab-match{display:none}
body.tab-match #tab-match{display:block}
body.tab-match #tab-params{display:none}
.icon-btn{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--mute);transition:background .2s,color .2s,transform .2s}
.icon-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#grab{display:none}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 10px 20px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14px,#000 calc(100% - 18px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 14px,#000 calc(100% - 18px),transparent 100%)}
#scroll::-webkit-scrollbar{width:4px}
#scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
section{padding:6px 0 10px;border-top:1px solid var(--line)}
section:first-child{border-top:0}
section>h2{margin:0;padding:10px 0 8px;display:flex;align-items:baseline;gap:9px;font-weight:500;font-size:12.5px;letter-spacing:.24em;color:var(--ink);cursor:pointer}
section>h2 em{font-style:normal;font-size:9.5px;letter-spacing:.3em;color:var(--faint);text-transform:uppercase;flex:1}
section>h2 i{width:6px;height:6px;border-right:1px solid var(--faint);border-bottom:1px solid var(--faint);transform:rotate(45deg) translateY(-2px);transition:transform .3s}
section.closed>h2 i{transform:rotate(-45deg)}
section .body{overflow:hidden}
section.closed .body{display:none}

.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 6px}
.chip{padding:6px 11px;border-radius:999px;font-size:12px;letter-spacing:.06em;color:var(--mute);border:1px solid var(--line);background:rgba(255,255,255,.025);transition:all .25s;white-space:nowrap}
.chip:hover{color:#fff;border-color:var(--line2);background:rgba(255,255,255,.06)}
.chip.on{color:#fff;border-color:transparent;background:rgba(255,255,255,.16);background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 38%,transparent),color-mix(in srgb,var(--accent2) 38%,transparent));box-shadow:0 0 18px color-mix(in srgb,var(--accent2) 30%,transparent),inset 0 0 0 1px rgba(255,255,255,.18)}

.row{padding:5px 0 3px;transition:opacity .3s}
.row.off{opacity:.32;pointer-events:none}
.row .head{display:flex;align-items:center;gap:8px;height:20px}
.row label{font-size:12px;letter-spacing:.05em;color:var(--mute);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row label small{font-size:10px;color:var(--faint);letter-spacing:.04em;margin-left:7px;font-family:var(--serif);font-style:italic}
.row output{font-family:var(--num);font-size:11px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:0;min-width:42px;text-align:right}
.dot{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;flex:none;margin-left:-3px}
.dot::before{content:"";width:6px;height:6px;border-radius:50%;border:1px solid var(--faint);transition:all .25s}
.dot:hover::before{border-color:#fff}
.dot.on::before{border-color:transparent;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent),0 0 10px var(--accent);animation:pulse 2.4s ease-in-out infinite}
body.paused .dot.on::before{animation:none;opacity:.55}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 8%,transparent),0 0 14px var(--accent)}}
.nodot{width:13px;flex:none}

input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:20px;margin:0;background:transparent;cursor:pointer;touch-action:pan-y;outline:none}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent) 0,var(--accent2) var(--p,50%),rgba(255,255,255,.13) var(--p,50%))}
input[type=range]::-moz-range-track{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent) 0,var(--accent2) var(--p,50%),rgba(255,255,255,.13) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;margin-top:-5px;border-radius:50%;border:0;background:#fff;
  box-shadow:0 0 0 4px rgba(255,255,255,.07),0 0 14px color-mix(in srgb,var(--accent2) 80%,transparent);transition:transform .15s,box-shadow .15s}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.07),0 0 14px color-mix(in srgb,var(--accent2) 80%,transparent)}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25);box-shadow:0 0 0 6px rgba(255,255,255,.09),0 0 18px var(--accent2)}

.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid var(--line);margin:4px 0 8px}
.seg button{flex:1;padding:6px 0;border-radius:9px;font-size:12px;letter-spacing:.1em;color:var(--mute);transition:all .25s;white-space:nowrap}
.seg button:hover{color:#fff}
.seg button.on{color:#fff;background:rgba(255,255,255,.14);background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 30%,transparent),color-mix(in srgb,var(--accent2) 34%,transparent));box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.cap{font-size:11px;letter-spacing:.14em;color:var(--faint);margin:8px 0 2px}
.swatches{display:flex;gap:9px;padding:6px 0 8px;flex-wrap:wrap}
.sw{position:relative;width:34px;height:34px;border-radius:50%;transition:transform .25s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.sw:hover{transform:scale(1.08)}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3px rgba(255,255,255,.85),0 0 18px rgba(255,255,255,.25)}
.sw span{position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);font-size:9.5px;letter-spacing:.08em;color:var(--faint);white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.sw.on span{opacity:1;color:var(--mute)}
.swatches{padding-bottom:20px}

.toggles{display:flex;gap:6px;margin:4px 0 8px}
.tg{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:7px 0;border-radius:11px;font-size:12px;letter-spacing:.1em;color:var(--faint);border:1px solid var(--line);background:rgba(255,255,255,.02);transition:all .25s}
.tg::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5;transition:all .25s}
.tg.on{color:#fff;border-color:var(--line2);background:rgba(255,255,255,.07)}
.tg.on::before{background:var(--accent);opacity:1;box-shadow:0 0 8px var(--accent)}
.sw-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12px;letter-spacing:.05em;color:var(--mute)}
.sw-row span{flex:1}
.sw-row small{color:var(--faint);font-size:10px;margin-left:6px;letter-spacing:.06em}
.switch{width:34px;height:19px;border-radius:999px;background:rgba(255,255,255,.1);position:relative;transition:background .3s;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.switch::after{content:"";position:absolute;left:2.5px;top:2.5px;width:14px;height:14px;border-radius:50%;background:#cfd4ea;transition:transform .3s cubic-bezier(.3,1.4,.5,1),background .3s}
.switch.on{background:var(--accent);background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,transparent),color-mix(in srgb,var(--accent2) 80%,transparent))}
.switch.on::after{transform:translateX(15px);background:#fff}
.sep-btn{flex:none;width:100%;height:34px;margin:2px 0 6px;position:relative}
.sep-btn .i-close,.sep-btn.open .i-open{display:none}
.sep-btn.open .i-close{display:block}
.sep-btn.open{color:#fff;border-color:transparent;background:rgba(255,255,255,.12);background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 30%,transparent),color-mix(in srgb,var(--accent2) 34%,transparent));box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.sep-btn kbd{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-family:var(--num);font-size:9.5px;letter-spacing:0;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
@media (pointer:coarse){.sep-btn kbd{display:none}}
/* ---------- 解 ↔ 线 ---------- */
.m{font-family:var(--serif);font-style:italic;letter-spacing:.01em}
.m sup,.m sub{font-family:var(--serif);font-style:normal;font-size:.66em;letter-spacing:0}
.ov{text-decoration:overline;text-decoration-thickness:1px}
.pc{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.22),0 0 9px currentColor}
.nseg{margin-top:2px}
.nseg button{letter-spacing:.02em;font-family:var(--num);font-size:11px}
.fx{margin:2px 0 8px;padding:10px 12px 9px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.fx .ln{display:flex;align-items:baseline;gap:10px;padding:2px 0;min-height:24px}
.fx .ln>i{flex:none;width:26px;font-style:normal;font-size:10px;letter-spacing:.14em;color:var(--faint)}
.fx .ln .m{font-size:15.5px;color:var(--ink);white-space:nowrap}
.fx .ln .v{margin-left:auto;font-family:var(--num);font-size:10px;color:var(--faint);white-space:nowrap}
.fx .val{margin:4px 0 1px 36px;font-family:var(--num);font-size:10px;line-height:1.8;color:var(--faint)}
.fx .val sup{font-size:.74em}
.fx .ln b{font-weight:400;font-family:var(--num);font-size:11px;color:var(--ink)}
.fx .ln .pc{align-self:center;margin-right:-2px}
.fx .sub{font-size:10.5px;line-height:1.75;letter-spacing:.03em;color:var(--faint);margin:3px 0 4px}
.fx .sub sup,.fx .sub sub{font-size:.72em}
.fx .cur{margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.leg{max-height:222px;overflow-y:auto;margin:2px -8px 6px;padding:0 4px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent;overscroll-behavior:contain;position:relative}
.leg::-webkit-scrollbar{width:4px}
.leg::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
.it{display:flex;align-items:center;gap:9px;width:100%;height:27px;padding:0 8px;border-radius:9px;text-align:left;transition:background .2s}
.it b{flex:none;width:74px;font-weight:400;font-family:var(--num);font-size:10.5px;color:var(--mute);letter-spacing:0}
.it .m{flex:1;font-size:13.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it:hover{background:rgba(255,255,255,.055)}
.it.on{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px var(--line2)}
.it.on b,.it.on .m{color:#fff}
.pts{margin:6px -8px 6px;font-family:var(--num);font-size:10.5px;font-variant-numeric:tabular-nums}
.tr{display:grid;grid-template-columns:20px 1fr 1.3fr 1.3fr;gap:4px;align-items:center;width:100%;height:23px;padding:0 8px;border-radius:8px;text-align:right;color:var(--mute);letter-spacing:0;font-size:inherit}
.tr span:first-child{text-align:center;color:var(--faint)}
.tr.th{height:20px;color:var(--faint);font-family:var(--serif);font-style:italic;font-size:12.5px}
.tr.th sub{font-family:var(--num);font-style:normal;font-size:.64em}
button.tr{font-family:var(--num);transition:background .15s}
button.tr.hv,button.tr:hover{background:rgba(255,255,255,.06);color:#fff}
button.tr.on{background:rgba(255,255,255,.11);color:#fff;box-shadow:inset 0 0 0 1px var(--line2)}
button.tr.on span:first-child,button.tr.hv span:first-child{color:var(--accent)}
.det{margin:4px 0 8px;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line);font-family:var(--num);font-size:10.5px;color:var(--mute);min-height:42px}
.det .hd{display:flex;gap:8px;align-items:center;color:#fff;margin-bottom:5px;font-size:11px}
.det .hd span:last-child{margin-left:auto;color:var(--mute)}
.det .ln{display:flex;gap:8px;align-items:baseline;padding:2px 0;white-space:nowrap}
.det .ln>i{flex:none;width:22px;font-style:normal;color:var(--faint);font-size:10px}
.det .ln>i.m{font-style:italic;font-size:13px;color:var(--mute)}
.det .ln b{font-weight:400;color:var(--ink)}
.det .ln em{font-style:normal;color:var(--faint);margin-left:auto;font-size:9.5px}
.det .ln .m{font-size:12.5px;color:var(--mute)}
.det .chk{margin-top:4px;padding-top:6px;border-top:1px solid var(--line)}
.det .chk em{color:var(--accent);font-size:11px}
.det .nt{font-family:var(--sans);font-size:10.5px;color:var(--faint);margin-top:5px;letter-spacing:.03em;line-height:1.65;white-space:normal}
.det .nt sub{font-size:.7em}
#hud .br{display:none;margin-top:11px;align-items:center;gap:9px;color:var(--ink);white-space:nowrap}
#hud .br b{font-weight:400;font-family:var(--num);font-size:11px;letter-spacing:.02em;color:var(--mute)}
#hud .br .m{font-size:16.5px}
body.tab-match #hud .br{display:flex}
#marks{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden;display:none}
#marks.show{display:block}
.mk{position:absolute;left:0;top:0;margin:-22px 0 0 9px;display:none;gap:7px;align-items:flex-start;font-family:var(--num);font-size:10px;line-height:1.45;color:rgba(255,255,255,.82);padding:0 5px;border-radius:6px;background:rgba(8,10,22,.5);white-space:nowrap}
.mk b{font-weight:400}
.mk em{display:none;font-style:normal;color:rgba(236,239,250,.86)}
.mk.show{display:flex}
.mk.on{margin:-46px 0 0 14px;padding:4px 8px;color:#fff;background:rgba(10,12,26,.84);box-shadow:0 0 0 1px var(--line2),0 8px 22px rgba(0,0,0,.45);z-index:1}
.mk.on b{color:var(--accent)}
.mk.on em{display:block}
.note{font-size:10.5px;line-height:1.7;letter-spacing:.04em;color:var(--faint);margin:2px 0 6px}
.note b{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:0 3px;vertical-align:1px}

#panel footer{flex:none;display:flex;gap:8px;padding:10px 16px 16px 20px;border-top:1px solid var(--line)}
.btn{flex:1;height:36px;border-radius:12px;font-size:12px;letter-spacing:.2em;color:var(--mute);border:1px solid var(--line);background:rgba(255,255,255,.03);display:flex;align-items:center;justify-content:center;gap:7px;transition:all .25s}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{color:#fff;border-color:var(--line2);background:rgba(255,255,255,.07)}
.btn:active{transform:scale(.97)}
.btn.primary{flex:1.5;color:#fff;border-color:transparent;background:rgba(255,255,255,.14);background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 42%,transparent),color-mix(in srgb,var(--accent2) 48%,transparent));box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 8px 26px color-mix(in srgb,var(--accent2) 22%,transparent)}

#open{position:fixed;top:22px;right:22px;z-index:4;height:36px;padding:0 15px;border-radius:999px;font-size:12px;letter-spacing:.24em;color:var(--mute);
  background:rgba(16,18,34,.5);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);opacity:0;pointer-events:none;transition:opacity .5s,color .2s}
body.ui-hidden #open{opacity:.75;pointer-events:auto}
#open:hover{color:#fff;opacity:1}
#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,16px);padding:9px 18px;border-radius:999px;font-size:12px;letter-spacing:.18em;color:#fff;background:rgba(16,18,34,.72);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line2);opacity:0;pointer-events:none;transition:all .45s cubic-bezier(.2,.8,.2,1);z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fatal{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:30px;z-index:20;background:radial-gradient(circle at 50% 40%,#12163a,#04050b 70%);font-size:14px;line-height:2;letter-spacing:.1em;color:var(--mute)}
#fatal b{display:block;font-family:var(--serif);font-size:26px;letter-spacing:.2em;color:#fff;font-weight:500;margin-bottom:10px}

/* ---------- mobile: bottom sheet ---------- */
@media (max-width:760px){
  #hud{left:20px;top:calc(16px + env(safe-area-inset-top))}
  #hud h1{font-size:21px}
  #hud .sub{font-size:8.5px;margin-top:5px}
  #hud .eq{font-size:15px;margin-top:10px}
  #hud .meta{font-size:10px}
  #hint{display:none}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:min(58vh,520px);border-radius:24px 24px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}

  body.ui-hidden #panel{transform:translateY(calc(100% + 10px))}
  #panel header{padding:20px 14px 8px 20px}
  #grab{display:block;position:absolute;left:0;right:0;top:0;height:22px;cursor:grab}
  #grab::after{content:"";position:absolute;left:50%;top:8px;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:rgba(255,255,255,.22)}
  #scroll{padding:0 16px 8px 20px}
  #tab-params section:first-child .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 0 -20px;padding:2px 16px 8px 20px;scrollbar-width:none}
  #tab-params section:first-child .chips::-webkit-scrollbar{display:none}
  #tab-params section:first-child>h2{display:none}
  #hud .br{margin-top:7px;flex-wrap:wrap;gap:3px 8px;max-width:calc(100vw - 40px)}
  #hud .br .m{font-size:13.5px}
  .tab{padding:8px 10px;font-size:12.5px}
  .leg{max-height:170px}
  .it{height:32px}
  .tr{height:28px}
  .chip{padding:8px 13px;font-size:12.5px}
  input[type=range]{height:30px}
  input[type=range]::-webkit-slider-thumb{width:16px;height:16px;margin-top:-7px}
  input[type=range]::-moz-range-thumb{width:16px;height:16px}
  .row .head{height:22px}
  .dot{width:24px;height:24px;margin-left:-7px}
  .dot::before{width:8px;height:8px}
  .nodot{width:17px}
  #panel footer{padding:8px 16px 12px 20px}
  #open{top:calc(14px + env(safe-area-inset-top));right:14px}
  #toast{bottom:auto;top:calc(70px + env(safe-area-inset-top))}
}

#define PI 3.141592653589793
#define HPI 1.5707963267948966
uniform float uN1, uN2, uC1, uC2, uW1, uW2;
uniform float uMu, uPsiArg, uNeck, uYext, uQ, uPersp, uBreath, uTime, uScale, uWarp;
uniform mat4 uRot;
// 面片分离：每个面片 (k1,k2) 作为刚体沿其质心方向外推，可选绕自身中心微缩
uniform float uGap, uShrink, uSep3D, uSepFocus, uHiFocus, uSolo;
uniform vec3 uSepMode;          // 分组权重：逐片 / 按 k1 / 按 k2
uniform vec2 uPiv;              // 面片中心的 |z1|, |z2|
uniform vec2 uSepW[81];         // 每个面片的权重，平滑过渡：x = 参与分离，y = 「解 ↔ 线」对照选中
vec4 gSepT = vec4(0.0), gSepPiv = vec4(0.0);
float gSepS = 1.0, gSel = 1.0, gHi = 0.0, gBright = 1.0;
void cySepInit(float k1, float k2){
  vec2 pw = uSepW[int(k2)*9 + int(k1)];
  gSel = pw.x; gHi = pw.y * uHiFocus;
  gBright = min(mix(1.0, pw.x, uSepFocus), mix(1.0, pw.y, uHiFocus));
  float t1 = 2.0*PI*k1/uN1, t2 = 2.0*PI*k2/uN2;
  // 四维坐标顺序 (Re z1, Re z2, Im z1, Im z2)
  vec4 E1 = vec4(cos(t1), 0.0, sin(t1), 0.0), E2 = vec4(0.0, cos(t2), 0.0, sin(t2));
  float a = uSepMode.x * 0.70710678;
  vec4 R = uRot * ((a + uSepMode.y)*E1 + (a + uSepMode.z)*E2);
  vec3 d3 = R.xyz / sqrt(dot(R.xyz, R.xyz) + 0.02);
  gSepT = mix(R, vec4(d3, 0.0), uSep3D) * (uGap * gSel);
  gSepS = 1.0 - uShrink * gSel;
  gSepPiv = uNeck * ((uSepMode.x + uSepMode.y)*uPiv.x*E1 + (uSepMode.x + uSepMode.z)*uPiv.y*E2);
}

vec2 cmul(vec2 a, vec2 b){ return vec2(a.x*b.x - a.y*b.y, a.x*b.y + a.y*b.x); }
vec2 cpw(vec2 z, float p){
  float r2 = dot(z, z);
  if (r2 < 1e-18) return vec2(0.0);
  // 正实轴上显式取 0：部分实现对 atan(-0.0, x>0) 会返回 π
  float a = (z.y == 0.0 && z.x > 0.0) ? 0.0 : atan(z.y, z.x) * p;
  return pow(r2, 0.5*p) * vec2(cos(a), sin(a));
}
float spow(float x, float p){ return x < 1e-7 ? 0.0 : pow(x, p); }   // pow(0,p) 在部分驱动上不精确
// 参数域重映射：在面片顶点（分支点）附近加密采样
vec2 cyDomain(vec2 st){
  float pa = mix(1.0, clamp(0.5*uN2, 1.0, 2.2), uWarp), pb = mix(1.0, clamp(0.5*uN1, 1.0, 2.2), uWarp);
  float s = st.x;
  float gx = s < 0.5 ? 0.5*spow(2.0*s, pa) : 1.0 - 0.5*spow(2.0 - 2.0*s, pb);
  float tau = 2.0*st.y - 1.0;
  float gy = sign(tau) * spow(abs(tau), mix(1.0, uQ, uWarp));
  return vec2(gx*HPI, gy*uYext);
}
// Hanson 参数化：u1 = cos(ξ)^(2/n1), u2 = sin(ξ)^(2/n2)，再乘以单位根
// 并（可选）用最小范数牛顿迭代投影到 Dwork 形变曲面  u1^n1 + u2^n2 − μ·u1·u2 = 1
void cyUnit(vec2 xi, float k1, float k2, out vec2 u1, out vec2 u2, out vec2 mu){
  float cx = cos(xi.x), sx = sin(xi.x), ch = cosh(xi.y), sh = sinh(xi.y);
  u1 = cpw(vec2(cx*ch, -sx*sh), 2.0/uN1);
  u2 = cpw(vec2(sx*ch,  cx*sh), 2.0/uN2);
  mu = vec2(0.0);
  if (uMu > 1e-5) {
    float am = uPsiArg + 2.0*PI*(k1/uN1 + k2/uN2);
    mu = uMu * vec2(cos(am), sin(am));
    // 同伦延拓：μ 从 0 逐步增大到目标值，每步做一次牛顿校正
    for (int i = 0; i < 9; i++) {
      vec2 m = mu * min(1.0, float(i + 1) / 7.0);
      vec2 a1 = cpw(u1, uN1 - 1.0), a2 = cpw(u2, uN2 - 1.0);
      vec2 g  = cmul(a1, u1) + cmul(a2, u2) - vec2(1.0, 0.0) - cmul(m, cmul(u1, u2));
      vec2 g1 = uN1*a1 - cmul(m, u2);
      vec2 g2 = uN2*a2 - cmul(m, u1);
      float d = dot(g1, g1) + dot(g2, g2) + 1e-7;
      u1 -= cmul(g, vec2(g1.x, -g1.y)) / d;
      u2 -= cmul(g, vec2(g2.x, -g2.y)) / d;
    }
  }
}
vec4 cyZ(vec2 u1, vec2 u2, float k1, float k2){
  float t1 = 2.0*PI*k1/uN1, t2 = 2.0*PI*k2/uN2;
  vec2 z1 = cmul(u1, vec2(cos(t1), sin(t1)));
  vec2 z2 = cmul(u2, vec2(cos(t2), sin(t2)));
  return vec4(z1, z2);
}
// ℂ² ≅ ℝ⁴ → 四维旋转 → ℝ³
vec4 cyRot(vec4 z){
  vec4 p = vec4(z.x, z.z, z.y, z.w) * uNeck;   // (Re z1, Re z2, Im z1, Im z2)
  float r = length(p);
  p *= 1.0 + uBreath * sin(uTime*1.15 - 2.4*r);
  return uRot * mix(gSepPiv, p, gSepS) + gSepT;
}
vec3 cyProj(vec4 q){
  float wc = 2.2 * tanh(q.w / 2.2);
  return q.xyz * (uScale / (1.0 - uPersp*wc));
}
vec3 cyPos(vec2 xi, float k1, float k2){
  vec2 u1, u2, mu; cyUnit(xi, k1, k2, u1, u2, mu);
  return cyProj(cyRot(cyZ(u1, u2, k1, k2)));
}
float cyPatchWeight(float k1, float k2){
  float w = (k1 > uC1 - 1.5 ? uW1 : 1.0) * (k2 > uC2 - 1.5 ? uW2 : 1.0);
  return w * mix(1.0, uSepW[int(k2)*9 + int(k1)].y, uSolo);      // 「仅显示选中」
}
// ℂ² 中复曲线的内蕴高斯曲率 |K| = 2|H|² / |∇g|⁶ （复曲线是极小曲面，K ≤ 0）
float cyCurv(vec2 u1, vec2 u2, vec2 mu){
  vec2 b1 = cpw(u1, uN1 - 2.0), b2 = cpw(u2, uN2 - 2.0);
  vec2 g1 = uN1*cmul(b1, u1) - cmul(mu, u2);
  vec2 g2 = uN2*cmul(b2, u2) - cmul(mu, u1);
  vec2 g11 = uN1*(uN1 - 1.0)*b1, g22 = uN2*(uN2 - 1.0)*b2;
  vec2 H = cmul(g11, cmul(g2, g2)) + 2.0*cmul(mu, cmul(g1, g2)) + cmul(g22, cmul(g1, g1));
  float G = dot(g1, g1) + dot(g2, g2);
  return 2.0*dot(H, H) / (G*G*G + 1e-6);
}
`;

canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); toast('图形上下文丢失，正在恢复…'); });

/* ---------- 启动 ---------- */
setPalette(P.palette, true);
bgU.uA.value.set(...bgTarget.a); bgU.uB.value.set(...bgTarget.b); starU.uTint.value.set(...bgTarget.c);
applyMaterial();
W = window.innerWidth; H = window.innerHeight; computeFit(); camera.position.setLength(fitDist);
resize(); camera.position.setLength(fitDist); off.x = off.tx; off.y = off.ty;
const startPreset = QS.get('preset');
if (startPreset && PRESETS.some(p => p.id === startPreset)) applyPreset(startPreset, true);
// ?gap=0.6 初始间隙；?group=patch|row|col 分组方式
const qGap = parseFloat(QS.get('gap')), qGroup = QS.get('group');
if (isFinite(qGap)) { P.gap = clamp(qGap, 0, DEF.gap.max); P.autos.gap = false; if (P.gap > 0.08) sepLast = P.gap; activePreset = null; }
if (SEP_GROUPS.some(g => g[0] === qGroup)) { P.sepGroup = qGroup; activePreset = null; }
// ?match 打开「解 ↔ 线」对照；?match=1,2 同时选中 k₁=1, k₂=2；?solo 仅显示选中
if (QS.has('match')) {
  const mk = (QS.get('match') || '').split(',').map(Number);
  if (mk.length === 2 && mk.every(v => Number.isInteger(v) && v >= 0 && v < 9)) { P.selK1 = mk[0]; P.selK2 = mk[1]; }
  if (QS.has('solo')) P.solo = true;
  ui.setTab('match');
  if (mqMobile.matches) document.body.classList.remove('sheet-peek');
}
ui.syncAll();
if (QS.has('clean')) document.body.classList.add('ui-hidden'), relayout(), off.x = off.tx, off.y = off.ty;

// 调试 / 录制接口
window.CY = {
  P, DEF, PRESETS, applyPreset, applyState, randomize, screenshot, step, toggleSep, animateGap, pickPatch, pickAt,
  setTab: id => ui.setTab(id), setSel, lockPt, quickN, match: M, sepW, U,
  dbg: { markSel: () => Array.from(markPts.geometry.attributes.aSel.array), markCount: () => markPts.visible ? markPts.geometry.drawRange.count : 0 },
  setManual(m) { manual = !!m; if (!manual) { last = performance.now(); requestAnimationFrame(frame); } },
  set(k, v) { P[k] = v; if (DEF[k] && DEF[k].auto) syncAuto(k); if (k === 'palette') setPalette(v); if (k === 'material') applyMaterial(); syncGeometry(); ui.syncAll(); },
  get info() { return { pixelRatio, W, H, fitDist, dist: camera.position.length(), emaDt, sepLast };  },
  camera, controls, renderer
};
if (QS.has('manual')) { manual = true; step(0); } else requestAnimationFrame(frame);
document.body.classList.add('ready');
})();
</script>
